<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elaichi — The Dual-Stack JavaScript Runtime</title>
  <link rel="icon" type="image/svg+xml" href="elaichi-icon.svg">
  
  <!-- Official Docsify Dark Theme as rock-solid base -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <style>
    :root {
      --font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font: "JetBrains Mono", Consolas, monospace;

      /* Bun Dark Palette */
      --bg-canvas: #0c0d0e;
      --bg-sidebar: #08090a;
      --bg-surface: #121417;
      --bg-code: #111317;
      --border-subtle: #1e2227;
      --border-hover: rgba(181, 232, 83, 0.4);

      /* Accents */
      --accent-lime: #B5E853;
      --accent-orange: #FF8364;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    /* Prevent horizontal page shifts when toggling sidebar */
    html, body {
      overflow-x: hidden !important;
      position: relative !important;
    }

    body {
      background-color: var(--bg-canvas) !important;
      color: var(--text-main) !important;
      font-family: var(--font-family) !important;
      -webkit-font-smoothing: antialiased;
      transform: none !important;
      transition: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    body.close {
      transform: none !important;
    }

    /* ==========================================================================
       RIGHT SIDEBAR ARCHITECTURE (Fully Responsive Drawer & Desktop Dock)
       ========================================================================== */
    .sidebar {
      left: auto !important;
      right: 0 !important;
      width: 280px !important;
      height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      bottom: 0 !important;
      background-color: var(--bg-sidebar) !important;
      border-left: 1px solid var(--border-subtle) !important;
      border-right: none !important;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
      z-index: 100 !important;
      box-shadow: -6px 0 30px rgba(0, 0, 0, 0.45) !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
    }

    /* Logo inside Sidebar */
    .app-name-link {
      padding: 24px 20px 18px !important;
      display: flex !important;
      align-items: center !important;
      text-decoration: none !important;
    }

    .app-name-link img {
      width: 170px !important;
      height: auto !important;
      background: transparent !important;
    }

    /* Sidebar Navigation Links */
    .sidebar-nav {
      padding: 0 16px 40px !important;
    }

    .sidebar-nav ul {
      list-style: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .sidebar-nav li {
      margin: 4px 0 !important;
    }

    .sidebar-nav a {
      display: block !important;
      font-size: 0.92rem !important;
      font-weight: 500 !important;
      color: var(--text-muted) !important;
      padding: 8px 14px !important;
      border-radius: 2px !important;
      text-decoration: none !important;
      transition: all 0.15s ease !important;
    }

    .sidebar-nav a:hover {
      color: #ffffff !important;
      background: rgba(255, 255, 255, 0.05) !important;
    }

    .sidebar-nav li.active > a {
      color: var(--accent-lime) !important;
      background: rgba(181, 232, 83, 0.08) !important;
      font-weight: 600 !important;
    }

    /* Sidebar Toggle Button (Hamburger) */
    .sidebar-toggle {
      left: auto !important;
      right: 292px !important;
      bottom: auto !important;
      top: 18px !important;
      width: 38px !important;
      height: 38px !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 5px !important;
      background: #16181d !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 2px !important;
      cursor: pointer !important;
      z-index: 110 !important;
      transition: right 0.28s cubic-bezier(0.16, 1, 0.3, 1), background 0.15s ease !important;
    }

    .sidebar-toggle:hover {
      background: #20242b !important;
      border-color: #3b4252 !important;
    }

    .sidebar-toggle span {
      background-color: var(--accent-lime) !important;
      height: 2px !important;
      width: 18px !important;
      display: block !important;
      margin: 0 !important;
      border-radius: 0 !important;
    }

    /* Desktop Toggle Closed State (Hidden off to the right) */
    body.close .sidebar {
      transform: translateX(100%) !important;
    }

    body.close .sidebar-toggle {
      right: 20px !important;
    }

    /* ==========================================================================
       MAIN CONTENT CANVAS & STABLE CENTERED PAGE
       ========================================================================== */
    .content {
      position: static !important;
      left: 0 !important;
      right: 0 !important;
      top: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
      min-height: 100vh !important;
      transform: none !important;
      transition: none !important;
    }

    body.close .content {
      padding: 0 !important;
      transform: none !important;
    }

    /* Centered Reading Column stays completely locked in place */
    .markdown-section {
      max-width: 980px !important;
      margin: 0 auto !important;
      padding: 48px 48px 120px !important;
      box-sizing: border-box !important;
      transform: none !important;
      transition: none !important;
    }

    /* ==========================================================================
       HERO BANNER & GRID CARDS
       ========================================================================== */
    .hero-container {
      text-align: center;
      padding: 48px 20px 40px;
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 2px !important;
      background: rgba(181, 232, 83, 0.12);
      border: 1px solid rgba(181, 232, 83, 0.28);
      color: var(--accent-lime);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 24px;
    }

    .hero-container h1 {
      font-size: 3.2rem !important;
      font-weight: 800 !important;
      letter-spacing: -1.2px !important;
      line-height: 1.1 !important;
      margin: 0 0 16px !important;
      color: #ffffff !important;
      border: none !important;
    }

    .hero-container p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent-lime);
      color: #0c0d0e;
      font-weight: 700;
      padding: 12px 26px;
      border-radius: 2px !important;
      text-decoration: none;
      font-size: 0.95rem;
      transition: transform 0.15s ease, background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: #c8fa5f;
      transform: translateY(-1px);
      color: #0c0d0e;
    }

    .btn-secondary {
      background: #16181d;
      color: #f1f5f9;
      border: 1px solid #282c34;
      font-weight: 600;
      padding: 12px 26px;
      border-radius: 2px !important;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.15s ease;
    }

    .btn-secondary:hover {
      background: #20242b;
      border-color: #3b4252;
      color: #ffffff;
    }

    .install-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 2px !important;
      padding: 14px 24px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--code-font);
      font-size: 0.95rem;
      margin: 28px auto 0;
      color: #f1f5f9;
    }

    .install-prompt {
      color: #64748b;
      user-select: none;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
      margin: 36px 0;
      width: 100%;
    }

    .feature-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 2px !important;
      padding: 24px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .feature-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .feature-card-tag {
      font-family: var(--code-font);
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-lime);
      margin-bottom: 10px;
    }

    .feature-card h3 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .feature-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 0;
    }

    /* ==========================================================================
       CODE BLOCKS & SYNTAX HIGHLIGHTING
       ========================================================================== */
    .markdown-section pre,
    .markdown-section pre[class*="language-"] {
      background: var(--bg-code) !important;
      border: 1px solid var(--border-subtle) !important;
      border-radius: 2px !important;
      margin: 24px 0 !important;
      padding: 22px 26px !important;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35) !important;
      position: relative !important;
      overflow-x: auto !important;
    }

    .markdown-section code,
    .markdown-section code[class*="language-"] {
      font-family: var(--code-font) !important;
      font-size: 0.92rem !important;
      line-height: 1.7 !important;
      color: #e2e8f0 !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
    }

    /* Inline Code Pill */
    .markdown-section p code,
    .markdown-section li code,
    .markdown-section table code {
      background: #181b21 !important;
      color: var(--accent-lime) !important;
      border: 1px solid #282d37 !important;
      padding: 3px 8px !important;
      border-radius: 2px !important;
      font-size: 0.86em !important;
      font-weight: 500 !important;
    }

    /* Token Syntax Palette */
    .token.comment, .token.prolog, .token.doctype, .token.cdata {
      color: #636d7d !important;
      font-style: italic !important;
    }
    .token.punctuation {
      color: #8b949e !important;
    }
    .token.property, .token.tag, .token.boolean, .token.number, .token.constant {
      color: var(--accent-orange) !important;
      font-weight: 500 !important;
    }
    .token.string, .token.char, .token.builtin {
      color: var(--accent-lime) !important;
    }
    .token.operator {
      color: #67e8f9 !important;
    }
    .token.keyword {
      color: #f472b6 !important;
      font-weight: 600 !important;
    }
    .token.function {
      color: #60a5fa !important;
      font-weight: 600 !important;
    }
    .token.variable {
      color: #fbbf24 !important;
    }

    /* Copy Button */
    .docsify-copy-code-button {
      background: #1c2027 !important;
      color: var(--text-muted) !important;
      border-radius: 2px !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      padding: 6px 12px !important;
      border: 1px solid #2d333f !important;
      top: 14px !important;
      right: 14px !important;
      transition: all 0.15s ease !important;
    }

    .docsify-copy-code-button:hover {
      color: #ffffff !important;
      background: #282f3a !important;
      border-color: #3f4757 !important;
    }

    /* ==========================================================================
       HIGH-CONTRAST SCROLLABLE TABLES
       ========================================================================== */
    .markdown-section table {
      display: block !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      width: 100% !important;
      border-radius: 2px !important;
      border: 1px solid #22262e !important;
      border-spacing: 0 !important;
      border-collapse: separate !important;
      margin: 32px 0 !important;
      background: #111317 !important;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4) !important;
    }

    .markdown-section table th,
    .markdown-section table td {
      white-space: nowrap !important;
    }

    .markdown-section table th {
      background: #171a21 !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 0.9rem !important;
      letter-spacing: 0.3px !important;
      border: none !important;
      border-bottom: 2px solid #282e38 !important;
      padding: 16px 20px !important;
      text-align: left !important;
    }

    .markdown-section table td {
      background: #111317 !important;
      color: #cbd5e1 !important;
      border: none !important;
      border-bottom: 1px solid #1c2026 !important;
      padding: 15px 20px !important;
      font-size: 0.92rem !important;
      line-height: 1.6 !important;
    }

    .markdown-section table tr:last-child td {
      border-bottom: none !important;
    }

    /* Alternating row styling & smooth hover highlight */
    .markdown-section table tr:nth-child(even) td {
      background: #14171d !important;
    }

    .markdown-section table tr:hover td {
      background: #1b1f27 !important;
      color: #ffffff !important;
    }

    /* Bold first column text or Elaichi column text */
    .markdown-section table td strong {
      color: #B5E853 !important; /* Bun cardamom accent for emphasized table cells */
    }

    /* Typography Hierarchy */
    .markdown-section h1 {
      font-size: 2.3rem !important;
      font-weight: 800 !important;
      letter-spacing: -0.6px !important;
      color: #ffffff !important;
      margin: 0 0 20px !important;
      border-bottom: none !important;
    }

    .markdown-section h2 {
      font-size: 1.6rem !important;
      font-weight: 700 !important;
      letter-spacing: -0.4px !important;
      color: #ffffff !important;
      margin-top: 48px !important;
      border-bottom: 1px solid var(--border-subtle) !important;
      padding-bottom: 12px !important;
    }

    .markdown-section h3 {
      font-size: 1.22rem !important;
      font-weight: 600 !important;
      color: #f1f5f9 !important;
      margin-top: 28px !important;
    }

    .markdown-section hr {
      border: none !important;
      border-top: 1px solid var(--border-subtle) !important;
      margin: 40px 0 !important;
    }

    /* Responsive Breakpoints & Fluid Typography */
    @media (max-width: 1024px) {
      .markdown-section {
        padding: 40px 24px 100px !important;
      }
      .feature-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) !important;
      }
    }

    @media (max-width: 768px) {
      /* Mobile Sidebar Drawer: Hidden offscreen by default */
      .sidebar {
        transform: translateX(100%) !important;
        width: 270px !important;
        max-width: 80vw !important;
        box-shadow: -8px 0 35px rgba(0, 0, 0, 0.6) !important;
      }

      /* When open (default on Docsify or toggled) */
      body:not(.close) .sidebar {
        transform: translateX(100%) !important;
      }

      /* In Docsify mobile, body.close opens the drawer */
      body.close .sidebar {
        transform: translateX(0) !important;
      }

      /* Mobile Toggle Button */
      .sidebar-toggle {
        top: 14px !important;
        right: 16px !important;
        left: auto !important;
        width: 38px !important;
        height: 38px !important;
        border-radius: 2px !important;
      }

      /* When sidebar drawer is visible, shift hamburger into viewport alignment */
      body.close .sidebar-toggle {
        right: calc(min(270px, 80vw) + 12px) !important;
      }

      /* Content Padding */
      .markdown-section {
        padding: 24px 16px 80px !important;
      }

      /* Hero Section on Mobile */
      .hero-container {
        padding: 36px 12px 28px !important;
        margin-bottom: 24px !important;
      }
      .hero-container h1 {
        font-size: 2.2rem !important;
        letter-spacing: -0.8px !important;
      }
      .hero-container p {
        font-size: 1.05rem !important;
        margin-bottom: 24px !important;
      }

      /* Actions & Code Box */
      .hero-actions {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 10px !important;
      }
      .btn-primary, .btn-secondary {
        justify-content: center !important;
        width: 100% !important;
        padding: 12px 18px !important;
        border-radius: 2px !important;
      }
      .install-box {
        width: 100% !important;
        justify-content: center !important;
        padding: 12px 16px !important;
        font-size: 0.85rem !important;
        overflow-x: auto !important;
        border-radius: 2px !important;
      }

      /* Feature Grid */
      .feature-grid {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
        margin: 24px 0 !important;
      }
      .feature-card {
        padding: 20px !important;
        border-radius: 2px !important;
      }

      /* Pre blocks */
      .markdown-section pre,
      .markdown-section pre[class*="language-"] {
        padding: 16px 16px !important;
        border-radius: 2px !important;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: '<img src="elaichi-logo.svg" alt="elaichi">',
      repo: 'https://github.com/Nikhil012N/elaichi',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>

  <!-- Docsify Core & Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-clike.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
